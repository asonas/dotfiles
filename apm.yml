name: asonas-dotfiles
version: 1.0.0
description: Personal global agent rules and skills, shared across Claude Code, Cursor, and Codex
author: Yuya Fujiwara
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: copilot, claude, cursor, opencode, codex, gemini, windsurf, all
targets:
  - claude
  - cursor
  - codex
dependencies:
  apm:
    # Anthropic official skills (skill form so Cursor can load them too;
    # the plugin form in anthropics/claude-plugins-official is Claude-only).
    # Note: anthropics/skills nests entries under `skills/`, so the subpath
    # is `skills/frontend-design`, not `frontend-design`.
    - anthropics/skills/skills/frontend-design
    # emilkowalski/skills: Emil Kowalski (ex-Vercel/Linear) のデザインエンジニア
    # 向けスキル集（animation-vocabulary / emil-design-eng / improve-animations /
    # review-animations）。2026-05-01〜07-25 の 188 セッションで 1 回も起動されず、
    # description 1,026 文字を毎セッション消費していたため除外した（review-animations
    # は disable-model-invocation なのでスキル一覧には出ていなかった）。UI の
    # ガイドラインは apply-apple-interface-guidelines を使っている。必要になったら
    # ここに名前を足せば戻る。エントリは `skills/` 配下にネストしているので
    # frontend-design と同じサブパス指定にする。
    # Plugins migrated from Claude Code marketplaces (single-repo form).
    - obra/superpowers
    # laiso/cman: manage via Claude Code plugin (`/plugin install cman@cman`),
    # not APM. APM only places sources; it does not register the plugin with
    # Claude Code, so APM-only management leaves cman non-functional.
    # st0012/cctop: 同じ理由で APM 管理から外した。実体は Claude Code プラグイン
    # (`cctop@cctop`) 側にあり、APM は cctop から何も配備していなかった（install の
    # 出力に skill/command の integrated 行が出ず、~/.claude/skills にも
    # ~/.claude/commands にも cctop 由来のファイルが無い）。唯一届いていたのは
    # root CLAUDE.md に混入する `Read AGENTS.md NOW` の 167 バイトだった。
    # macOS 専用なので、必要なマシンでプラグインを入れる。
    # kepano/obsidian-skills: defuddle だけを取り込む。json-canvas /
    # obsidian-bases / obsidian-cli / obsidian-markdown は配備以来（2026-06-12）
    # 一度も起動されておらず、スキル一覧のトークンだけ消費していたため除外した。
    # 必要になったらここに名前を足せば戻る。
    # エントリが `skills/` 配下にネストしているので、frontend-design や ax と同じ
    # サブパス指定にする。`skills:` フィルタはこのネストで解決できるか不明。
    - kepano/obsidian-skills/skills/defuddle
    # ax: AI 向け curl 代替（fetch / discover / extract）。skill は skills/ax に
    # ネストしているのでサブパス指定する（frontend-design と同様）。リポジトリ直下の
    # CLAUDE.md は ax 自身の開発用（Bun 強制など）なので、丸ごと参照するとグローバル
    # CLAUDE.md に混入する。サブパス指定なら skill だけを取り込める。バイナリ本体は
    # 別途 `curl -fsSL https://ax.yusuke.run/install | sh` が必要（apm は SKILL.md のみ配布）。
    - yusukebe/ax/skills/ax
    # sorah/config is a monorepo-style marketplace; pin the specific plugin paths.
    - sorah/config/claude/marketplace/plugins/sorah-spec
    - git: sorah/config/claude/marketplace/plugins/sorah-guides
      skills:
        - coding
        - commit-style
        - rails
        - ruby
        - rust
        - security
        - terraform
        - typescript
    # Self-authored skills published from asonas/skills.
    # cross-review is intentionally absent: the locally-maintained copy in
    # .claude/user-skills/cross-review (deployed as a symlink by install.sh)
    # has diverged ahead of the published package, and APM refuses to deploy
    # over the symlink anyway.
    - asonas/skills/commit
    # comment-quality（takai の gist f17b43412243221f918509e989df0a3b を vendor）と
    # entire は 2026-05-01〜07-25 の 188 セッションで 1 回も起動されなかった。
    # description は comment-quality が 758 文字で単体最大、entire が 79 文字。
    # どちらも source は asonas/skills 側に残っているので、ここに名前を足せば戻る。
    - asonas/skills/git-worktree-workflow
    # herdr: herdr（ターミナル常駐エージェントマルチプレクサ）を herdr 内から
    # 操作するための agent skill。upstream ogulcancelik/herdr の SKILL.md を vendor
    # したもの（HERDR_ENV=1 のときのみ有効化）。巨大 Rust リポジトリの直接依存を避け、
    # clean な skill 名で配備するため asonas/skills 配下に複製している。
    # 更新は upstream を再取得して上書き:
    #   curl -fsSL -A "claude-code/1.0" \
    #     https://raw.githubusercontent.com/ogulcancelik/herdr/master/SKILL.md \
    #     -o ~/ghq/github.com/asonas/skills/herdr/SKILL.md
    - asonas/skills/herdr
    # japanese-tech-writing: 日本語技術文書・書籍原稿の文章規範。
    # k16shikano の gist (fd287c3133457c4fd8f5601d34aa817d) を vendor したもの。
    # gist 直参照だと APM が gist ID 名で配備し /japanese-tech-writing で起動でき
    # ないため、asonas/skills 配下に複製して clean な skill 名で配備している。
    - asonas/skills/japanese-tech-writing
    # cognitive-rhythm-writing: 説明的な文章に認知リズム（緩急）を設計するための
    # 規範。japanese-tech-writing の姉妹スキルで、作業前に
    # ../japanese-tech-writing/SKILL.md を併読する前提（配備時に兄弟ディレクトリと
    # して並ぶので相対参照が解決する）。k16shikano の gist
    # (eb2929f13ed19c97188393d297be8432) を vendor したもの。gist 直参照だと APM が
    # gist ID 名で配備し /cognitive-rhythm-writing で起動できないため、asonas/skills
    # 配下に複製して clean な skill 名で配備している。
    - asonas/skills/cognitive-rhythm-writing
    - asonas/skills/pr-review
    # legacy-code-improvement と usb-debug も同じ 188 セッションで 0 回。source は
    # asonas/skills 側に残っている。
  mcp: []
includes: auto
scripts: {}
